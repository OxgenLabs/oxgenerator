[package]
name = "oxgen"
version = "0.1.3"
edition = "2024"
description = "A Rust CLI for generating clean backend project structures."
license = "Apache-2.0"
repository = "https://github.com/OxgeneratorLabs/oxgenerator"
homepage = "https://github.com/OxgeneratorLabs/oxgenerator"
readme = "README.md"
keywords = ["cli", "generator", "rust", "backend"]
categories = ["command-line-utilities"]
include = [
    "src/**",
    "templates/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE"
]

[[bin]]
name = "oxgen"
path = "src/main.rs"

[dependencies]
include_dir = "0.7.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
